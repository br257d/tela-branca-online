<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tela Compartilhada</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#f6f3ff;
    --panel:#ffffff;
    --line:#e7e1f5;
    --ink:#241f3d;
    --muted:#7d76a3;
    --accent:#6c4cff;
    --accent-ink:#ffffff;
    --warm:#ff6f59;
    --radius:16px;
    --shadow:0 10px 30px rgba(40,20,90,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
  }
  button{ font-family:inherit; }
  #app{ display:flex; flex-direction:column; height:100vh; }

  #topbar{
    display:flex; align-items:center; gap:14px;
    padding:10px 18px; background:var(--panel);
    border-bottom:1px solid var(--line); box-shadow:var(--shadow);
    z-index:30; flex:0 0 auto;
  }
  .brand{ font-weight:700; font-size:17px; letter-spacing:.2px; }
  .brand span{ color:var(--accent); }
  #online-count{ font-size:13px; color:var(--muted); margin-left:auto; white-space:nowrap; }
  #btn-nickname{
    background:var(--bg); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; font-size:13px; color:var(--ink); cursor:pointer;
  }
  .panel-toggle{
    display:none; background:none; border:1px solid var(--line); border-radius:10px;
    width:36px; height:36px; font-size:16px; cursor:pointer; color:var(--ink);
  }

  #layout{ flex:1; display:flex; min-height:0; }

  .side-panel{
    width:230px; flex:0 0 auto; background:var(--panel);
    display:flex; flex-direction:column; min-height:0;
    padding:12px; gap:10px;
  }
  #chat-panel{ border-right:1px solid var(--line); }
  #shapes-panel{ border-left:1px solid var(--line); overflow-y:auto; }
  .side-panel h3{ margin:4px 0 2px; font-size:13px; text-transform:none; color:var(--muted); font-weight:600; }

  #chat-messages{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:2px; }
  .chat-msg{ font-size:14px; line-height:1.4; }
  .chat-msg.system{ color:var(--muted); font-style:italic; }
  .chat-name{ font-weight:700; color:var(--accent); margin-right:6px; }
  .chat-text{ overflow-wrap:anywhere; }
  #chat-form{ display:flex; gap:6px; flex:0 0 auto; }
  #chat-input{
    flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 10px;
    font-size:14px; font-family:inherit; color:var(--ink);
  }
  #chat-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  #chat-form button{
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    width:38px; cursor:pointer; font-size:15px;
  }

  #shapes-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .shape-btn{
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:10px; cursor:pointer; color:var(--ink);
  }
  .shape-btn svg{ width:100%; height:28px; display:block; }
  .shape-btn:hover{ border-color:var(--accent); }

  .media-add{ display:flex; gap:6px; }
  #media-url{
    flex:1; min-width:0; border:1px solid var(--line); border-radius:10px;
    padding:9px 10px; font-size:13px; font-family:inherit;
  }
  #btn-add-media{
    background:var(--warm); color:#fff; border:none; border-radius:10px;
    padding:0 12px; cursor:pointer; font-size:13px; font-weight:600;
  }
  #media-tray{ display:flex; flex-direction:column; gap:8px; }
  .media-card{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line);
    border-radius:10px; padding:6px; cursor:grab; background:var(--bg);
  }
  .media-card img, .media-card video{ width:38px; height:38px; object-fit:cover; border-radius:6px; background:#000; }
  .media-card span{ font-size:12px; color:var(--muted); }

  #canvas-area{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; padding:10px; gap:10px; }
  .canvas-scaler{ flex:1; min-height:0; min-width:0; display:flex; align-items:center; justify-content:center; }
  #canvas-viewport{
    position:relative; background:#fff;
    border-radius:var(--radius); box-shadow:var(--shadow);
    overflow:hidden; touch-action:none;
  }
  #canvas-wrapper{
    position:absolute; top:0; left:0; width:100%; height:100%;
    transform-origin:0 0;
  }
  #draw-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #canvas-viewport{ cursor:crosshair; }
  #canvas-viewport.pan-mode{ cursor:grab; }
  #canvas-viewport.pan-mode.panning{ cursor:grabbing; }
  #objects-layer{ position:absolute; inset:0; pointer-events:none; }
  #cursors-layer{ position:absolute; inset:0; pointer-events:none; z-index:5; }

  .object-item{
    position:absolute; pointer-events:auto; cursor:grab; touch-action:none;
    aspect-ratio:1;
  }
  .object-item:active{ cursor:grabbing; }
  .object-item svg{ width:100%; height:100%; display:block; overflow:visible; }
  .object-item img, .object-item video{ width:100%; height:100%; object-fit:contain; display:block; border-radius:8px; }
  .obj-del{
    position:absolute; top:-8px; right:-8px; width:20px; height:20px;
    border-radius:50%; background:var(--ink); color:#fff; border:2px solid #fff;
    font-size:12px; line-height:1; cursor:pointer; display:none; align-items:center; justify-content:center;
  }
  .obj-resize{
    position:absolute; bottom:-7px; right:-7px; width:16px; height:16px;
    border-radius:5px; background:var(--accent); border:2px solid #fff;
    cursor:nwse-resize; display:none; touch-action:none;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .object-item:hover .obj-del, .object-item:hover .obj-resize{ display:flex; }

  .cursor-dot{ position:absolute; pointer-events:none; transform:translate(-2px,-2px); transition:left .05s linear, top .05s linear; }
  .cursor-tip{
    display:block; width:12px; height:12px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg); box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .cursor-label{
    display:inline-block; margin-top:2px; padding:2px 7px; border-radius:999px;
    font-size:11px; color:#fff; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }

  #toolbar{
    flex:0 0 auto; background:var(--panel); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:10px 14px; display:flex; align-items:center;
    gap:16px; flex-wrap:wrap;
  }
  .tool-group{ display:flex; gap:6px; align-items:center; }
  .swatch{
    width:24px; height:24px; border-radius:50%; border:2px solid #fff;
    box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0;
  }
  .swatch-white{ box-shadow:0 0 0 1px #c9c2e0 inset, 0 0 0 1px var(--line); }
  #color-picker{ width:30px; height:30px; border:none; border-radius:8px; padding:0; cursor:pointer; background:none; }
  .tool-btn, .size-btn{
    background:var(--bg); border:1px solid var(--line); border-radius:9px;
    padding:7px 10px; cursor:pointer; font-size:15px; color:var(--ink);
  }
  .size-btn{ font-size:12px; font-weight:700; width:32px; }
  .tool-btn.active, .size-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  #zoom-tools{ background:var(--bg); border-radius:9px; padding:4px 6px; }
  #zoom-tools button{
    background:none; border:none; width:26px; height:26px; border-radius:6px;
    cursor:pointer; font-size:15px; color:var(--ink);
  }
  #zoom-tools button:hover{ background:#fff; }
  #zoom-tools button.active{ background:var(--accent); color:#fff; }
  #zoom-label{ font-size:12px; color:var(--muted); width:38px; text-align:center; display:inline-block; }
  #btn-undo{
    margin-left:auto; background:none; border:1px solid var(--line); border-radius:9px;
    padding:8px 12px; cursor:pointer; font-size:13px; color:var(--ink);
  }

  #nickname-modal{
    position:fixed; inset:0; background:rgba(36,31,61,.55); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  #nickname-modal.show{ display:flex; }
  .modal-card{
    background:#fff; border-radius:18px; padding:26px; width:100%; max-width:340px;
    box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center;
  }
  .modal-card h2{ margin:0 0 14px; font-size:19px; }
  .modal-card input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit; margin-bottom:12px; text-align:center;
  }
  .modal-card input:focus{ outline:2px solid var(--accent); }
  .modal-card button{
    width:100%; background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:12px; font-size:14px; font-weight:700; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  @media (max-width:900px){
    .panel-toggle{ display:flex; align-items:center; justify-content:center; }
    .side-panel{
      position:fixed; top:56px; bottom:0; width:82vw; max-width:320px;
      z-index:40; transform:translateX(-110%); transition:transform .2s ease;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    #shapes-panel{ right:0; transform:translateX(110%); }
    body.show-chat #chat-panel{ transform:translateX(0); }
    body.show-tools #shapes-panel{ transform:translateX(0); }
    #canvas-area{ padding:10px; }
    #toolbar{ gap:10px; padding:8px 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">🎨 <span>Tela</span> Compartilhada</div>
    <button class="panel-toggle" id="toggle-chat" aria-label="Chat">💬</button>
    <button class="panel-toggle" id="toggle-tools" aria-label="Formas e mídia">🧰</button>
    <div id="online-count">conectando...</div>
    <button id="btn-nickname">Você: <span id="my-name">?</span></button>
  </header>

  <div id="layout">
    <aside id="chat-panel" class="side-panel">
      <h3>Chat</h3>
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input id="chat-input" maxlength="300" placeholder="Escreva algo..." autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </aside>

    <main id="canvas-area">
      <div class="canvas-scaler">
        <div id="canvas-viewport">
          <div id="canvas-wrapper">
            <canvas id="draw-canvas" width="2400" height="1500"></canvas>
            <div id="objects-layer"></div>
            <div id="cursors-layer"></div>
          </div>
        </div>
      </div>
      <div id="toolbar">
        <div class="tool-group" id="color-swatches"></div>
        <input type="color" id="color-picker" value="#241f3d" title="Cor personalizada">
        <div class="tool-group" id="brush-tools">
          <button class="tool-btn active" data-tool="pen" title="Caneta">✏️</button>
          <button class="tool-btn" data-tool="marker" title="Marcador">🖊️</button>
          <button class="tool-btn" data-tool="eraser" title="Borracha">🧽</button>
          <button class="tool-btn" data-tool="bucket" title="Balde de tinta (preenche a área toda de uma vez)">🪣</button>
          <button class="tool-btn" data-tool="smartfill" title="Pincel mágico (pinta rápido sem vazar pra fora)">🪄</button>
        </div>
        <div class="tool-group" id="size-tools">
          <button class="size-btn" data-size="8">S</button>
          <button class="size-btn active" data-size="20">M</button>
          <button class="size-btn" data-size="48">L</button>
        </div>
        <div class="tool-group" id="zoom-tools">
          <button id="btn-zoom-out" title="Diminuir zoom">−</button>
          <span id="zoom-label">100%</span>
          <button id="btn-zoom-in" title="Aumentar zoom">+</button>
          <button id="btn-pan-toggle" title="Mover a visão (arrastar)">🖐</button>
          <button id="btn-zoom-reset" title="Restaurar zoom">⤢</button>
        </div>
        <button id="btn-undo">↩ Desfazer</button>
      </div>
    </main>

    <aside id="shapes-panel" class="side-panel">
      <h3>Formas</h3>
      <div id="shapes-grid"></div>
      <h3>Imagem / vídeo por link</h3>
      <div class="media-add">
        <input id="media-url" placeholder="Cole a URL aqui" autocomplete="off">
        <button id="btn-add-media">Add</button>
      </div>
      <div id="media-tray"></div>
    </aside>
  </div>
</div>

<div id="nickname-modal">
  <div class="modal-card">
    <h2>Como podemos te chamar?</h2>
    <input id="nickname-input" maxlength="16" placeholder="Seu nome" autocomplete="off">
    <button id="btn-confirm-name">Entrar na tela</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyBg-xqXkl-AMCQAWUPfH4IeMSHVcu9HnVU",
    authDomain: "tela-branca.firebaseapp.com",
    databaseURL: "https://tela-branca-default-rtdb.firebaseio.com",
    projectId: "tela-branca",
    storageBucket: "tela-branca.firebasestorage.app",
    messagingSenderId: "508365843522",
    appId: "1:508365843522:web:540bad05b574d5d9cc11db",
    measurementId: "G-MST90P13M9"
  };

  var db = null;
  var firebaseReady = false;
  try {
    if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "COLE_AQUI" && window.firebase) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      firebaseReady = true;
    }
  } catch (e) { firebaseReady = false; }

  function $(id){ return document.getElementById(id); }

  var CANVAS_W = 2400, CANVAS_H = 1500;
  var myClientId = 'u' + Date.now() + Math.random().toString(36).slice(2,8);
  var myName = '';
  var CURSOR_COLORS = ['#6c4cff','#ff6f59','#12b5c9','#ff3b81','#39c95c','#f0a500'];
  var myColor = CURSOR_COLORS[Math.floor(Math.random()*CURSOR_COLORS.length)];
  var currentColor = '#241f3d';
  var currentTool = 'pen';
  var currentSize = 20;
  var myStrokeIds = [];

  var SHAPE_SVGS = {
    circle: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="currentColor"/></svg>',
    square: '<svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="10" fill="currentColor"/></svg>',
    triangle: '<svg viewBox="0 0 100 100"><polygon points="50,8 92,88 8,88" fill="currentColor"/></svg>',
    star: '<svg viewBox="0 0 100 100"><polygon points="50,5 61,37 96,37 68,58 79,91 50,71 21,91 32,58 4,37 39,37" fill="currentColor"/></svg>',
    heart: '<svg viewBox="0 0 100 100"><path d="M50 88 C10 62 4 36 24 22 C38 12 50 22 50 34 C50 22 62 12 76 22 C96 36 90 62 50 88 Z" fill="currentColor"/></svg>',
    arrow: '<svg viewBox="0 0 100 100"><path d="M10 42 H62 V24 L92 50 L62 76 V58 H10 Z" fill="currentColor"/></svg>'
  };
  var SHAPE_KEYS = ['circle','square','triangle','star','heart','arrow'];

  var COLORS = ['#241f3d','#ff3b3b','#ff9f1c','#ffd23f','#39c95c','#12b5c9','#3a6df0','#a24cff','#ff5da2','#ffffff'];

  var canvas = $('draw-canvas');
  var ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var canvasViewport = $('canvas-viewport');
  var canvasWrapper = $('canvas-wrapper');
  var canvasScaler = document.querySelector('.canvas-scaler');
  var objectsLayer = $('objects-layer');
  var cursorsLayer = $('cursors-layer');
  var chatMessagesEl = $('chat-messages');

  function resizeCanvasViewport(){
    var availW = canvasScaler.clientWidth;
    var availH = canvasScaler.clientHeight;
    if (!availW || !availH) return;
    var ratio = CANVAS_W / CANVAS_H;
    var w = availW;
    var h = w / ratio;
    if (h > availH){
      h = availH;
      w = h * ratio;
    }
    canvasViewport.style.width = w + 'px';
    canvasViewport.style.height = h + 'px';
    clampPan();
    applyTransform();
  }

  var zoom = 1;
  var panX = 0, panY = 0;
  var MIN_ZOOM = 1, MAX_ZOOM = 8;

  function applyTransform(){
    canvasWrapper.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
  }

  function clampPan(){
    var vw = canvasViewport.clientWidth;
    var vh = canvasViewport.clientHeight;
    var contentW = vw * zoom;
    var contentH = vh * zoom;
    var minX = Math.min(0, vw - contentW);
    var minY = Math.min(0, vh - contentH);
    panX = Math.max(minX, Math.min(0, panX));
    panY = Math.max(minY, Math.min(0, panY));
  }

  function setZoom(newZoom, anchorClientX, anchorClientY){
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    var rect = canvasViewport.getBoundingClientRect();
    var ax = (anchorClientX != null) ? (anchorClientX - rect.left) : rect.width / 2;
    var ay = (anchorClientY != null) ? (anchorClientY - rect.top) : rect.height / 2;
    var contentX = (ax - panX) / zoom;
    var contentY = (ay - panY) / zoom;
    zoom = newZoom;
    panX = ax - contentX * zoom;
    panY = ay - contentY * zoom;
    clampPan();
    applyTransform();
    $('zoom-label').textContent = Math.round(zoom * 100) + '%';
  }

  resizeCanvasViewport();
  requestAnimationFrame(resizeCanvasViewport);
  window.addEventListener('resize', resizeCanvasViewport);

  $('btn-zoom-in').addEventListener('click', function(){ setZoom(zoom + 0.5); });
  $('btn-zoom-out').addEventListener('click', function(){ setZoom(zoom - 0.5); });
  $('btn-zoom-reset').addEventListener('click', function(){
    zoom = 1; panX = 0; panY = 0;
    applyTransform();
    $('zoom-label').textContent = '100%';
  });

  var panMode = false;
  $('btn-pan-toggle').addEventListener('click', function(){
    panMode = !panMode;
    $('btn-pan-toggle').classList.toggle('active', panMode);
    canvasViewport.classList.toggle('pan-mode', panMode);
  });

  canvasViewport.addEventListener('wheel', function(e){
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    setZoom(zoom * factor, e.clientX, e.clientY);
  }, { passive:false });

  function paintWhiteBackground(){
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  }
  paintWhiteBackground();

  function getCanvasPos(e){
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    var scaleX = CANVAS_W / rect.width;
    var scaleY = CANVAS_H / rect.height;
    var x = (e.clientX - rect.left) * scaleX;
    var y = (e.clientY - rect.top) * scaleY;
    x = Math.max(0, Math.min(CANVAS_W, x));
    y = Math.max(0, Math.min(CANVAS_H, y));
    return { x: x, y: y };
  }

  function drawSegment(p1, p2, color, size){
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }

  var FILL_TOLERANCE = 28;

  function hexToRgb(hex){
    hex = String(hex).replace('#', '');
    if (hex.length === 3){
      hex = hex.split('').map(function(c){ return c + c; }).join('');
    }
    var num = parseInt(hex, 16) || 0;
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function floodFill(targetCtx, startX, startY, fillColor, tolerance){
    startX = Math.round(startX);
    startY = Math.round(startY);
    if (startX < 0 || startX >= CANVAS_W || startY < 0 || startY >= CANVAS_H) return;

    var imgData = targetCtx.getImageData(0, 0, CANVAS_W, CANVAS_H);
    var data = imgData.data;
    var startIdx = (startY * CANVAS_W + startX) * 4;
    var startR = data[startIdx], startG = data[startIdx+1], startB = data[startIdx+2], startA = data[startIdx+3];
    var fillRGB = hexToRgb(fillColor);

    if (Math.abs(startR - fillRGB.r) <= tolerance && Math.abs(startG - fillRGB.g) <= tolerance &&
        Math.abs(startB - fillRGB.b) <= tolerance && startA === 255){
      return;
    }

    function matches(idx){
      return Math.abs(data[idx] - startR) <= tolerance &&
             Math.abs(data[idx+1] - startG) <= tolerance &&
             Math.abs(data[idx+2] - startB) <= tolerance &&
             Math.abs(data[idx+3] - startA) <= tolerance;
    }

    var stack = [[startX, startY]];
    while (stack.length){
      var pt = stack.pop();
      var x = pt[0], y = pt[1];
      var idx = (y * CANVAS_W + x) * 4;
      if (!matches(idx)) continue;

      var xLeft = x;
      while (xLeft > 0 && matches((y * CANVAS_W + (xLeft - 1)) * 4)) xLeft--;
      var xRight = x;
      while (xRight < CANVAS_W - 1 && matches((y * CANVAS_W + (xRight + 1)) * 4)) xRight++;

      for (var xi = xLeft; xi <= xRight; xi++){
        var i = (y * CANVAS_W + xi) * 4;
        data[i] = fillRGB.r; data[i+1] = fillRGB.g; data[i+2] = fillRGB.b; data[i+3] = 255;
        if (y > 0){
          var upIdx = ((y - 1) * CANVAS_W + xi) * 4;
          if (matches(upIdx)) stack.push([xi, y - 1]);
        }
        if (y < CANVAS_H - 1){
          var downIdx = ((y + 1) * CANVAS_W + xi) * 4;
          if (matches(downIdx)) stack.push([xi, y + 1]);
        }
      }
    }

    targetCtx.putImageData(imgData, 0, 0);
  }

  function performFill(pos){
    if (!myName) return;
    var fillColor = currentColor;
    floodFill(ctx, pos.x, pos.y, fillColor, FILL_TOLERANCE);
    var fid = firebaseReady ? db.ref('strokes').push().key : ('f' + Date.now() + Math.random().toString(36).slice(2,6));
    myStrokeIds.push(fid);
    if (firebaseReady){
      db.ref('strokes/' + fid).set({
        type:'fill', x: Math.round(pos.x), y: Math.round(pos.y),
        color: fillColor, ts: Date.now(), by: myName
      });
    }
  }

  function computeFillMask(startX, startY, tolerance){
    startX = Math.round(startX);
    startY = Math.round(startY);
    if (startX < 0 || startX >= CANVAS_W || startY < 0 || startY >= CANVAS_H) return null;

    var imgData = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H);
    var data = imgData.data;
    var startIdx = (startY * CANVAS_W + startX) * 4;
    var startR = data[startIdx], startG = data[startIdx+1], startB = data[startIdx+2], startA = data[startIdx+3];

    function matches(idx){
      return Math.abs(data[idx] - startR) <= tolerance &&
             Math.abs(data[idx+1] - startG) <= tolerance &&
             Math.abs(data[idx+2] - startB) <= tolerance &&
             Math.abs(data[idx+3] - startA) <= tolerance;
    }

    var mask = new Uint8Array(CANVAS_W * CANVAS_H);
    mask[startY * CANVAS_W + startX] = 1;
    var stack = [[startX, startY]];

    while (stack.length){
      var pt = stack.pop();
      var x = pt[0], y = pt[1];

      var xLeft = x;
      while (xLeft > 0 && matches((y * CANVAS_W + (xLeft - 1)) * 4)) xLeft--;
      var xRight = x;
      while (xRight < CANVAS_W - 1 && matches((y * CANVAS_W + (xRight + 1)) * 4)) xRight++;

      for (var xi = xLeft; xi <= xRight; xi++){
        mask[y * CANVAS_W + xi] = 1;
        if (y > 0){
          var upMaskIdx = (y - 1) * CANVAS_W + xi;
          if (!mask[upMaskIdx] && matches(((y - 1) * CANVAS_W + xi) * 4)){
            mask[upMaskIdx] = 1;
            stack.push([xi, y - 1]);
          }
        }
        if (y < CANVAS_H - 1){
          var downMaskIdx = (y + 1) * CANVAS_W + xi;
          if (!mask[downMaskIdx] && matches(((y + 1) * CANVAS_W + xi) * 4)){
            mask[downMaskIdx] = 1;
            stack.push([xi, y + 1]);
          }
        }
      }
    }

    return mask;
  }

  function isInsideMask(mask, x, y){
    var xi = Math.round(x), yi = Math.round(y);
    if (xi < 0 || xi >= CANVAS_W || yi < 0 || yi >= CANVAS_H) return false;
    return mask[yi * CANVAS_W + xi] === 1;
  }

  function interpolateSteps(p1, p2, maxStep){
    var dx = p2.x - p1.x, dy = p2.y - p1.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var steps = Math.max(1, Math.ceil(dist / maxStep));
    var pts = [];
    for (var i=1;i<=steps;i++){
      var t = i / steps;
      pts.push({ x: p1.x + dx*t, y: p1.y + dy*t });
    }
    return pts;
  }

  var smartFillMask = null;
  var smartFillLastRawPoint = null;
  var smartFillInsideActive = false;
  var smartFillLastInsidePoint = null;
  var drawingSmartFill = false;

  function handleSmartFillSample(pos){
    if (!smartFillMask) return;
    if (isInsideMask(smartFillMask, pos.x, pos.y)){
      if (!smartFillInsideActive){
        smartFillInsideActive = true;
        var sid = firebaseReady ? db.ref('strokes').push().key : ('l' + Date.now() + Math.random().toString(36).slice(2,6));
        currentStroke = { id: sid, color: currentColor, size: currentSize };
        myStrokeIds.push(sid);
        pendingPoints = [[pos.x, pos.y]];
        drawSegment(pos, pos, currentStroke.color, currentStroke.size);
        if (firebaseReady){
          db.ref('strokes/' + sid).set({ color: currentStroke.color, size: currentStroke.size, ts: Date.now(), by: myName });
        }
        smartFillLastInsidePoint = pos;
      } else {
        drawSegment(smartFillLastInsidePoint, pos, currentStroke.color, currentStroke.size);
        pendingPoints.push([pos.x, pos.y]);
        scheduleFlush();
        smartFillLastInsidePoint = pos;
      }
    } else if (smartFillInsideActive){
      if (flushTimer){ clearTimeout(flushTimer); flushTimer = null; }
      flushPending();
      smartFillInsideActive = false;
      currentStroke = null;
    }
  }

  var drawing = false;
  var currentStroke = null;
  var lastPoint = null;
  var pendingPoints = [];
  var flushTimer = null;

  function scheduleFlush(){
    if (flushTimer) return;
    flushTimer = setTimeout(function(){
      flushTimer = null;
      flushPending();
    }, 60);
  }

  function flushPending(){
    if (!currentStroke || !pendingPoints.length) return;
    var pts = pendingPoints;
    pendingPoints = [];
    if (firebaseReady){
      db.ref('strokes/' + currentStroke.id + '/pts').push(pts);
    }
  }

  var panning = false;
  var panStartX = 0, panStartY = 0, panOrigX = 0, panOrigY = 0;

  function onPointerDown(e){
    if (panMode){
      panning = true;
      panStartX = e.clientX; panStartY = e.clientY;
      panOrigX = panX; panOrigY = panY;
      try { canvasViewport.setPointerCapture(e.pointerId); } catch(err){}
      canvasViewport.classList.add('panning');
      return;
    }
    if (e.target.closest && e.target.closest('.object-item')) return;
    if (!myName) return;
    var pos = getCanvasPos(e);
    if (!pos) return;

    if (currentTool === 'bucket'){
      performFill(pos);
      return;
    }

    if (currentTool === 'smartfill'){
      smartFillMask = computeFillMask(pos.x, pos.y, FILL_TOLERANCE);
      if (!smartFillMask) return;
      drawingSmartFill = true;
      smartFillLastRawPoint = pos;
      smartFillInsideActive = false;
      smartFillLastInsidePoint = null;
      currentStroke = null;
      handleSmartFillSample(pos);
      try { canvasViewport.setPointerCapture(e.pointerId); } catch(err){}
      return;
    }

    drawing = true;
    var sid = firebaseReady ? db.ref('strokes').push().key : ('l' + Date.now() + Math.random().toString(36).slice(2,6));
    currentStroke = { id: sid, color: currentTool === 'eraser' ? '#ffffff' : currentColor, size: currentSize };
    myStrokeIds.push(sid);
    lastPoint = pos;
    drawSegment(pos, pos, currentStroke.color, currentStroke.size);
    pendingPoints = [[pos.x, pos.y]];
    if (firebaseReady){
      db.ref('strokes/' + sid).set({ color: currentStroke.color, size: currentStroke.size, ts: Date.now(), by: myName });
    }
    try { canvasViewport.setPointerCapture(e.pointerId); } catch(err){}
  }

  function onPointerMove(e){
    if (panning){
      panX = panOrigX + (e.clientX - panStartX);
      panY = panOrigY + (e.clientY - panStartY);
      clampPan();
      applyTransform();
      return;
    }
    var pos = getCanvasPos(e);
    if (!pos) return;
    sendCursor(pos);

    if (drawingSmartFill){
      var samples = interpolateSteps(smartFillLastRawPoint, pos, 4);
      samples.forEach(handleSmartFillSample);
      smartFillLastRawPoint = pos;
      return;
    }

    if (!drawing || !currentStroke) return;
    drawSegment(lastPoint, pos, currentStroke.color, currentStroke.size);
    lastPoint = pos;
    pendingPoints.push([pos.x, pos.y]);
    scheduleFlush();
  }

  function onPointerUp(){
    if (panning){
      panning = false;
      canvasViewport.classList.remove('panning');
    }
    if (drawingSmartFill){
      if (smartFillInsideActive){
        if (flushTimer){ clearTimeout(flushTimer); flushTimer = null; }
        flushPending();
      }
      drawingSmartFill = false;
      smartFillInsideActive = false;
      smartFillMask = null;
      currentStroke = null;
      return;
    }
    if (drawing){
      if (flushTimer){ clearTimeout(flushTimer); flushTimer = null; }
      flushPending();
      drawing = false;
      currentStroke = null;
    }
  }

  canvasViewport.addEventListener('pointerdown', onPointerDown);
  canvasViewport.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  var strokePtsListeners = {};
  var strokeCache = {};
  var strokeOrder = [];

  function attachStrokePointsListener(sid, meta, initialPrevPoint, skipBatchCount){
    if (strokePtsListeners[sid]) return;
    strokePtsListeners[sid] = true;
    var prevPoint = initialPrevPoint || null;
    var seenBatches = 0;
    var toSkip = skipBatchCount || 0;
    db.ref('strokes/' + sid + '/pts').on('child_added', function(psnap){
      seenBatches++;
      if (seenBatches <= toSkip) return;
      var batch = psnap.val();
      if (!batch || !batch.length) return;
      var cacheEntry = strokeCache[sid];
      if (cacheEntry && cacheEntry.points){
        cacheEntry.points.push.apply(cacheEntry.points, batch);
      }
      for (var i=0;i<batch.length;i++){
        var p = { x: batch[i][0], y: batch[i][1] };
        if (prevPoint) drawSegment(prevPoint, p, meta.color, meta.size);
        else drawSegment(p, p, meta.color, meta.size);
        prevPoint = p;
      }
    });
  }

  function redrawFromCache(){
    paintWhiteBackground();
    strokeOrder.forEach(function(sid){
      var entry = strokeCache[sid];
      if (!entry) return;
      if (entry.isFill){
        floodFill(ctx, entry.meta.x, entry.meta.y, entry.meta.color, FILL_TOLERANCE);
        return;
      }
      var pts = entry.points || [];
      var prevPoint = null;
      for (var i=0;i<pts.length;i++){
        var p = { x: pts[i][0], y: pts[i][1] };
        if (prevPoint) drawSegment(prevPoint, p, entry.meta.color, entry.meta.size);
        else drawSegment(p, p, entry.meta.color, entry.meta.size);
        prevPoint = p;
      }
    });
  }

  function registerFillEntry(sid, meta){
    strokeCache[sid] = { meta: meta, isFill: true };
    strokeOrder.push(sid);
    floodFill(ctx, meta.x, meta.y, meta.color, FILL_TOLERANCE);
  }

  function attachStrokesListener(){
    if (!firebaseReady) return;
    db.ref('strokes').once('value').then(function(snap){
      snap.forEach(function(strokeSnap){
        var sid = strokeSnap.key;
        var meta = strokeSnap.val();
        if (meta && meta.type === 'fill'){
          registerFillEntry(sid, meta);
          return;
        }
        var pointsArray = [];
        var batchCount = 0;
        var prevPoint = null;
        strokeSnap.child('pts').forEach(function(batchSnap){
          batchCount++;
          var batch = batchSnap.val();
          if (!batch || !batch.length) return;
          pointsArray.push.apply(pointsArray, batch);
          for (var i=0;i<batch.length;i++){
            var p = { x: batch[i][0], y: batch[i][1] };
            if (prevPoint) drawSegment(prevPoint, p, meta.color, meta.size);
            else drawSegment(p, p, meta.color, meta.size);
            prevPoint = p;
          }
        });
        strokeCache[sid] = { meta: meta, isFill: false, points: pointsArray };
        strokeOrder.push(sid);
        attachStrokePointsListener(sid, meta, prevPoint, batchCount);
      });

      db.ref('strokes').on('child_added', function(snap){
        var sid = snap.key;
        if (strokeCache[sid]) return;
        var meta = snap.val();
        if (meta && meta.type === 'fill'){
          registerFillEntry(sid, meta);
          return;
        }
        strokeCache[sid] = { meta: meta, isFill: false, points: [] };
        strokeOrder.push(sid);
        attachStrokePointsListener(sid, meta, null, 0);
      });

      db.ref('strokes').on('child_removed', function(snap){
        var sid = snap.key;
        delete strokeCache[sid];
        var idx = strokeOrder.indexOf(sid);
        if (idx !== -1) strokeOrder.splice(idx, 1);
        redrawFromCache();
      });
    });
  }

  var undoOnCooldown = false;
  function undoLastStroke(){
    if (undoOnCooldown || !myStrokeIds.length || !firebaseReady) return;
    undoOnCooldown = true;
    $('btn-undo').disabled = true;
    var sid = myStrokeIds.pop();
    db.ref('strokes/' + sid).remove().then(function(){
      undoOnCooldown = false;
      $('btn-undo').disabled = false;
    }).catch(function(){
      undoOnCooldown = false;
      $('btn-undo').disabled = false;
    });
  }

  var lastCursorSent = 0;
  function sendCursor(pos){
    if (!firebaseReady || !myName) return;
    var now = Date.now();
    if (now - lastCursorSent < 55) return;
    lastCursorSent = now;
    db.ref('cursors/' + myClientId).set({
      x: (pos.x / CANVAS_W) * 100,
      y: (pos.y / CANVAS_H) * 100,
      name: myName,
      color: myColor,
      ts: now
    });
  }

  var cursorEls = {};
  function attachCursorsListener(){
    if (!firebaseReady) return;
    db.ref('cursors').on('value', function(snap){
      var seen = {};
      snap.forEach(function(c){
        var id = c.key;
        if (id === myClientId) return;
        seen[id] = true;
        var data = c.val();
        var el = cursorEls[id];
        if (!el){
          el = document.createElement('div');
          el.className = 'cursor-dot';
          var tip = document.createElement('span');
          tip.className = 'cursor-tip';
          var label = document.createElement('span');
          label.className = 'cursor-label';
          el.appendChild(tip);
          el.appendChild(label);
          cursorsLayer.appendChild(el);
          cursorEls[id] = el;
        }
        el.style.left = data.x + '%';
        el.style.top = data.y + '%';
        var tipEl = el.querySelector('.cursor-tip');
        var labelEl = el.querySelector('.cursor-label');
        tipEl.style.background = data.color || '#6c4cff';
        labelEl.style.background = data.color || '#6c4cff';
        labelEl.textContent = data.name || '...';
      });
      Object.keys(cursorEls).forEach(function(id){
        if (!seen[id]){
          cursorEls[id].remove();
          delete cursorEls[id];
        }
      });
      updateOnlineCount(Object.keys(seen).length + 1);
    });
  }

  function updateOnlineCount(n){
    $('online-count').textContent = '● ' + n + ' online';
  }

  var objectEls = {};
  var interactingObjectId = null;

  function makeObjectDraggable(id, el){
    var dragging = false;
    var offXPct = 0, offYPct = 0;
    el.addEventListener('pointerdown', function(e){
      if (e.target.classList && (e.target.classList.contains('obj-del') || e.target.classList.contains('obj-resize'))) return;
      dragging = true;
      interactingObjectId = id;
      try { el.setPointerCapture(e.pointerId); } catch(err){}
      var wrapRect = canvasWrapper.getBoundingClientRect();
      var elRect = el.getBoundingClientRect();
      offXPct = ((e.clientX - elRect.left) / wrapRect.width) * 100;
      offYPct = ((e.clientY - elRect.top) / wrapRect.height) * 100;
      el.style.zIndex = 10;
      e.stopPropagation();
    });
    el.addEventListener('pointermove', function(e){
      if (!dragging) return;
      var wrapRect = canvasWrapper.getBoundingClientRect();
      var xPct = ((e.clientX - wrapRect.left) / wrapRect.width) * 100 - offXPct;
      var yPct = ((e.clientY - wrapRect.top) / wrapRect.height) * 100 - offYPct;
      xPct = Math.max(0, Math.min(94, xPct));
      yPct = Math.max(0, Math.min(94, yPct));
      el.style.left = xPct + '%';
      el.style.top = yPct + '%';
      e.stopPropagation();
    });
    el.addEventListener('pointerup', function(e){
      if (!dragging) return;
      dragging = false;
      interactingObjectId = null;
      el.style.zIndex = '';
      var xPct = parseFloat(el.style.left);
      var yPct = parseFloat(el.style.top);
      if (firebaseReady) db.ref('objects/' + id).update({ xPct: xPct, yPct: yPct });
      e.stopPropagation();
    });
  }

  function makeObjectResizable(id, el, handle){
    var resizing = false;
    var startWidthPx = 0, startX = 0;
    handle.addEventListener('pointerdown', function(e){
      resizing = true;
      interactingObjectId = id;
      try { handle.setPointerCapture(e.pointerId); } catch(err){}
      startX = e.clientX;
      startWidthPx = el.getBoundingClientRect().width;
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', function(e){
      if (!resizing) return;
      var wrapRect = canvasWrapper.getBoundingClientRect();
      var newWidthPx = Math.max(20, startWidthPx + (e.clientX - startX));
      var wPct = Math.max(4, Math.min(80, (newWidthPx / wrapRect.width) * 100));
      el.style.width = wPct + '%';
      e.stopPropagation();
    });
    handle.addEventListener('pointerup', function(e){
      if (!resizing) return;
      resizing = false;
      interactingObjectId = null;
      var wPct = parseFloat(el.style.width);
      if (firebaseReady) db.ref('objects/' + id).update({ wPct: wPct });
      e.stopPropagation();
    });
  }

  function renderObject(id, data){
    var entry = objectEls[id];
    var el;
    var resizeHandle;
    if (!entry){
      el = document.createElement('div');
      el.className = 'object-item';
      objectsLayer.appendChild(el);
      resizeHandle = document.createElement('div');
      resizeHandle.className = 'obj-resize';
      resizeHandle.title = 'Redimensionar';
      entry = { el: el, resizeHandle: resizeHandle };
      objectEls[id] = entry;
      makeObjectDraggable(id, el);
      makeObjectResizable(id, el, resizeHandle);
    } else {
      el = entry.el;
      resizeHandle = entry.resizeHandle;
    }

    if (id !== interactingObjectId){
      el.style.left = data.xPct + '%';
      el.style.top = data.yPct + '%';
      el.style.width = (data.wPct || 12) + '%';
    }

    var oldContent = el.querySelector('.obj-content');
    if (oldContent) oldContent.remove();
    var oldDel = el.querySelector('.obj-del');
    if (oldDel) oldDel.remove();

    var content;
    if (data.type === 'shape'){
      content = document.createElement('div');
      content.innerHTML = SHAPE_SVGS[data.kind] || SHAPE_SVGS.circle;
      content.style.color = data.color || '#6c4cff';
      content.style.width = '100%';
      content.style.height = '100%';
    } else if (data.type === 'video'){
      content = document.createElement('video');
      content.src = data.url;
      content.controls = true;
      content.muted = true;
      content.loop = true;
      content.playsInline = true;
    } else {
      content = document.createElement('img');
      content.src = data.url;
      content.alt = '';
      content.draggable = false;
    }
    content.className = (content.className ? content.className + ' ' : '') + 'obj-content';
    el.appendChild(content);

    var delBtn = document.createElement('button');
    delBtn.className = 'obj-del';
    delBtn.title = 'Remover';
    delBtn.textContent = '\u00d7';
    delBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if (firebaseReady) db.ref('objects/' + id).remove();
    });
    el.appendChild(delBtn);
    el.appendChild(resizeHandle);
  }

      return;
    }
    db.ref('chat').push({ name: myName, text: text.slice(0,300), ts: Date.now() });
    $('chat-input').value = '';
  });

  function buildColorSwatches(){
    var wrap = $('color-swatches');
    COLORS.forEach(function(c){
      var b = document.createElement('button');
      b.className = 'swatch' + (c === '#ffffff' ? ' swatch-white' : '');
      b.style.background = c;
      b.addEventListener('click', function(){
        currentColor = c;
        $('color-picker').value = c;
      });
      wrap.appendChild(b);
    });
  }
  buildColorSwatches();

  $('color-picker').addEventListener('input', function(){ currentColor = this.value; });

  Array.prototype.forEach.call(document.querySelectorAll('.tool-btn'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tool-btn'), function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      currentTool = b.dataset.tool;
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.size-btn'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.size-btn'), function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      currentSize = parseInt(b.dataset.size, 10);
    });
  });
  $('btn-undo').addEventListener('click', undoLastStroke);

  $('toggle-chat').addEventListener('click', function(){
    document.body.classList.toggle('show-chat');
    document.body.classList.remove('show-tools');
  });
  $('toggle-tools').addEventListener('click', function(){
    document.body.classList.toggle('show-tools');
    document.body.classList.remove('show-chat');
  });

  function showOfflineNotice(){
    $('online-count').textContent = 'modo local (sem sincronizar)';
    appendChatMessage({ name:'Sistema', text:'Firebase não configurado — você está desenhando só localmente. Veja FIREBASE_CONFIG no código para compartilhar com outras pessoas.', ts:Date.now() }, true);
  }

  function afterNameSet(){
    if (firebaseReady){
      db.ref('cursors/' + myClientId).onDisconnect().remove();
      attachStrokesListener();
      attachCursorsListener();
      attachObjectsListener();
      attachChatListener();
    } else {
      showOfflineNotice();
    }
  }

  var hasJoined = false;

  function initNickname(){
    var modal = $('nickname-modal');
    var input = $('nickname-input');
    var btn = $('btn-confirm-name');
    function confirmName(){
      var v = input.value.trim();
      if (!v){ input.focus(); return; }
      myName = v.slice(0,16);
      $('my-name').textContent = myName;
      modal.classList.remove('show');
      if (!hasJoined){
        hasJoined = true;
        afterNameSet();
      }
    }
    btn.addEventListener('click', confirmName);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') confirmName(); });
    modal.classList.add('show');
    input.focus();
  }

  $('btn-nickname').addEventListener('click', function(){
    $('btn-confirm-name').textContent = hasJoined ? 'Salvar nome' : 'Entrar na tela';
    $('nickname-input').value = myName;
    $('nickname-modal').classList.add('show');
    $('nickname-input').focus();
  });

  initNickname();
})();
</script>
</body>
</html>
